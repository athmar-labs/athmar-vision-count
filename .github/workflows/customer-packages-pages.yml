name: Publish Customer Packages

# GitHub Pages serves one site per repository and every deployment replaces it entirely.
# Building every published customer package in one workflow keeps a deployment for one
# package from deleting the others (previously the demo and food workflows erased each other).

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/customer-packages-pages.yml
      - Assets/AthmarVisionCount/Editor/DemoCustomerPackageBuilder.cs
      - Assets/AthmarVisionCount/Editor/AthmarCustomerPackageBuilder.cs
      - Assets/AthmarVisionCount/Runtime/CustomerPackageManifest.cs
      - Assets/AthmarVisionCount/Runtime/CustomerPackageStore.cs
      - Assets/AthmarVisionCount/Runtime/SkuCatalogue.cs
      - Assets/AthmarVisionCount/Runtime/YoloOutputDecoder.cs
      - Packages/**
      - ProjectSettings/**

permissions:
  contents: write
  pages: write
  id-token: write

env:
  UNITY_VERSION: 6000.3.10f1
  PAGES_ROOT_URL: https://athmar-labs.github.io/athmar-vision-count
  DEMO_PACKAGE_BASE_URL: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1
  FOOD_PACKAGE_BASE_URL: https://athmar-labs.github.io/athmar-vision-count/athmar-food-v1
  FOOD_MODEL_URL: https://raw.githubusercontent.com/MoatasimFaroog1111/athmar-food-training/main/best_detect.onnx
  FOOD_CATALOGUE_URL: https://raw.githubusercontent.com/MoatasimFaroog1111/athmar-food-training/main/sku_catalogue_detect.csv

concurrency:
  group: customer-packages-pages
  cancel-in-progress: false

jobs:
  build-demo:
    name: Build and validate demo package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate demo customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.DemoCustomerPackageBuilder.Build
          customParameters: -demoPackageBaseUrl ${{ env.DEMO_PACKAGE_BASE_URL }}
          runAsHostUser: true

      - name: Validate generated install values
        shell: bash
        run: |
          test -s Build/DemoCustomerPackage/manifest.json
          test -s Build/DemoCustomerPackage/manifest.sha256
          test -s Build/DemoCustomerPackage/install-values.txt
          test -s Build/DemoCustomerPackage/production.sentis
          test -s Build/DemoCustomerPackage/sku_catalogue.csv
          grep -Eq '^[0-9a-fA-F]{64}$' Build/DemoCustomerPackage/manifest.sha256

      - name: Upload demo package artifact
        uses: actions/upload-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage
          if-no-files-found: error
          retention-days: 30

  build-food:
    name: Build and validate Athmar food package
    # Serialized after the demo build so the two Unity builds never activate the license concurrently.
    needs: build-demo
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Download trained model and catalogue
        shell: bash
        run: |
          mkdir -p Build/athmar-inputs
          curl --fail --silent --show-error --location "$FOOD_MODEL_URL" -o Build/athmar-inputs/best_detect.onnx
          curl --fail --silent --show-error --location "$FOOD_CATALOGUE_URL" -o Build/athmar-inputs/sku_catalogue.csv
          ls -la Build/athmar-inputs

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate Athmar customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.AthmarCustomerPackageBuilder.Build
          customParameters: >-
            -athmarPackageBaseUrl ${{ env.FOOD_PACKAGE_BASE_URL }}
            -athmarOnnxPath Build/athmar-inputs/best_detect.onnx
            -athmarCataloguePath Build/athmar-inputs/sku_catalogue.csv
            -athmarCustomerCode ATHMAR-FOOD-PILOT
            -athmarCustomerName Athmar-Food-Pilot
          runAsHostUser: true

      - name: Validate generated install values
        shell: bash
        run: |
          test -s Build/AthmarCustomerPackage/manifest.json
          test -s Build/AthmarCustomerPackage/manifest.sha256
          test -s Build/AthmarCustomerPackage/install-values.txt
          test -s Build/AthmarCustomerPackage/production.sentis
          test -s Build/AthmarCustomerPackage/sku_catalogue.csv
          grep -Eq '^[0-9a-fA-F]{64}$' Build/AthmarCustomerPackage/manifest.sha256

      - name: Upload food package artifact
        uses: actions/upload-artifact@v4
        with:
          name: athmar-food-customer-package
          path: Build/AthmarCustomerPackage
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy all packages to GitHub Pages
    needs: [build-demo, build-food]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download demo package artifact
        uses: actions/download-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage

      - name: Download food package artifact
        uses: actions/download-artifact@v4
        with:
          name: athmar-food-customer-package
          path: Build/AthmarCustomerPackage

      - name: Assemble site with every package
        shell: bash
        run: |
          publish() {
            local source="$1" target="$2"
            mkdir -p "_site/$target"
            for file in manifest.json manifest.sha256 install-values.txt production.sentis sku_catalogue.csv; do
              cp "$source/$file" "_site/$target/"
            done
          }
          publish Build/DemoCustomerPackage demo-customer-v1
          publish Build/AthmarCustomerPackage athmar-food-v1
          find _site -type f | sort

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify every published manifest
        shell: bash
        run: |
          verify() {
            local base_url="$1" title="$2"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location "$base_url/manifest.json" -o /tmp/manifest.json \
                && curl --fail --silent --show-error --location "$base_url/manifest.sha256" -o /tmp/manifest.sha256; then
                break
              fi
              sleep 10
            done
            local expected_sha actual_sha
            expected_sha="$(tr -d '[:space:]' < /tmp/manifest.sha256)"
            actual_sha="$(sha256sum /tmp/manifest.json | awk '{print $1}')"
            test "$actual_sha" = "$expected_sha"
            {
              echo "## $title"
              echo '```text'
              echo "Manifest URL: $base_url/manifest.json"
              echo "Manifest SHA-256: $actual_sha"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          verify "$DEMO_PACKAGE_BASE_URL" "Demo customer package install values"
          verify "$FOOD_PACKAGE_BASE_URL" "Athmar food package install values"

  persist-install-values:
    name: Persist published install values
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download demo package artifact
        uses: actions/download-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage

      - name: Download food package artifact
        uses: actions/download-artifact@v4
        with:
          name: athmar-food-customer-package
          path: Build/AthmarCustomerPackage

      - name: Persist install values in repository
        shell: bash
        run: |
          mkdir -p docs/generated
          cp Build/DemoCustomerPackage/install-values.txt docs/generated/demo-install-values.txt
          cp Build/DemoCustomerPackage/manifest.sha256 docs/generated/demo-manifest.sha256
          cp Build/AthmarCustomerPackage/install-values.txt docs/generated/athmar-food-install-values.txt
          cp Build/AthmarCustomerPackage/manifest.sha256 docs/generated/athmar-food-manifest.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated
          if ! git diff --cached --quiet; then
            git commit -m "docs: update customer package install values [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
