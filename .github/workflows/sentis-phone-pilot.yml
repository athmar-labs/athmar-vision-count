name: Sentis Phone Pilot APK

on:
  pull_request:
    paths:
      - ".github/workflows/sentis-phone-pilot.yml"
      - "tools/prepare_generic_embedding_model.py"
      - "tools/build_bulk_catalogue.py"
      - "Assets/AthmarVisionCount/Runtime/SentisProductEmbeddingExtractor.cs"
      - "Assets/AthmarVisionCount/Runtime/ProductEnrollmentCoordinator.cs"
      - "Assets/AthmarVisionCount/Runtime/ProductEnrollmentView.cs"
      - "Assets/AthmarVisionCount/Runtime/CustomerAdminView.cs"
      - "Assets/AthmarVisionCount/Runtime/CustomerPackageManifest.cs"
      - "Assets/AthmarVisionCount/Runtime/CustomerPackageStore.cs"
      - "Assets/AthmarVisionCount/Runtime/CustomerPackageInstaller.cs"
      - "Assets/AthmarVisionCount/Runtime/BulkProductCatalogue.cs"
      - "Assets/AthmarVisionCount/Runtime/BulkEmbeddingIndex.cs"
      - "Assets/AthmarVisionCount/Runtime/ProductEvidenceResolver.cs"
      - "Assets/AthmarVisionCount/Runtime/VisionInferenceRunner.cs"
      - "Assets/AthmarVisionCount/Runtime/CpuRgbTensorWriter.cs"
      - "Assets/AthmarVisionCount/Editor/GenericEmbeddingPilotBuilder.cs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sentis-phone-pilot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.10f1

jobs:
  build-pilot-apk:
    name: Build development APK with generic embedding
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare pinned generic embedding model
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            numpy==1.26.4 \
            protobuf==5.28.3 \
            onnx==1.17.0
          python tools/prepare_generic_embedding_model.py
          python -m py_compile tools/build_bulk_catalogue.py
          rm -rf tools/__pycache__
          test -s Assets/Generated/Resources/AthmarGenericEmbedding.onnx
          test -z "$(git status --porcelain --untracked-files=all | grep -v '^?? Assets/Generated/' || true)"

      - name: Reclaim runner disk space for Unity Android image
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true
          df -h /

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"
          if [ -z "$UNITY_SERIAL" ] && [ -z "$UNITY_LICENSE" ]; then
            echo "Missing Unity activation credential."
            exit 1
          fi

      - name: Build Android pilot APK
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_LICENSE: ${{ secrets.UNITY_SERIAL != '' && '' || secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: AthmarLabs.VisionCount.Editor.GenericEmbeddingPilotBuilder.BuildAndroidPilot
          runAsHostUser: true

      - name: Verify pilot outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s Build/AthmarVisionCount-SentisPilot.apk
          test -s Build/AthmarVisionCount-SentisPilot.apk.sha256
          test -s Assets/Generated/Resources/AthmarGenericEmbedding.provenance.json
          cat Build/AthmarVisionCount-SentisPilot.apk.sha256

      - name: Upload installable pilot APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: athmar-sentis-five-product-phone-pilot
          path: |
            Build/AthmarVisionCount-SentisPilot.apk
            Build/AthmarVisionCount-SentisPilot.apk.sha256
            Assets/Generated/Resources/AthmarGenericEmbedding.provenance.json
          if-no-files-found: error
          retention-days: 14
