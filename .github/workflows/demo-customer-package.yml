name: Publish Demo Customer Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo-customer-package.yml

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: demo-customer-package-pages
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.10f1
  DEMO_PACKAGE_BASE_URL: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1

jobs:
  build-and-publish:
    name: Build, validate and publish demo package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1/manifest.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate demo customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.DemoCustomerPackageBuilder.Build
          customParameters: -demoPackageBaseUrl ${{ env.DEMO_PACKAGE_BASE_URL }}
          runAsHostUser: true

      - name: Validate generated install values
        shell: bash
        run: |
          test -s Build/DemoCustomerPackage/manifest.json
          test -s Build/DemoCustomerPackage/manifest.sha256
          test -s Build/DemoCustomerPackage/install-values.txt
          test -s Build/DemoCustomerPackage/production.sentis
          test -s Build/DemoCustomerPackage/sku_catalogue.csv
          grep -Eq '^[0-9a-fA-F]{64}$' Build/DemoCustomerPackage/manifest.sha256
          echo '## Demo customer package install values' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat Build/DemoCustomerPackage/install-values.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete demo package artifact
        uses: actions/upload-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          mkdir -p _site/demo-customer-v1
          cp Build/DemoCustomerPackage/manifest.json _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/manifest.sha256 _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/install-values.txt _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/production.sentis _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/sku_catalogue.csv _site/demo-customer-v1/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist install values in repository
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p docs/generated
          cp Build/DemoCustomerPackage/install-values.txt docs/generated/demo-install-values.txt
          cp Build/DemoCustomerPackage/manifest.sha256 docs/generated/demo-manifest.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/demo-install-values.txt docs/generated/demo-manifest.sha256
          if ! git diff --cached --quiet; then
            git commit -m "docs: update demo package install values [skip ci]"
            git push origin HEAD:main
          fi
