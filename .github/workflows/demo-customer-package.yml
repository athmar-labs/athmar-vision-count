name: Publish Demo Customer Package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/demo-customer-package.yml
      - Assets/AthmarVisionCount/Editor/DemoCustomerPackageBuilder.cs
      - Assets/AthmarVisionCount/Runtime/CustomerPackageManifest.cs
      - Assets/AthmarVisionCount/Runtime/CustomerPackageStore.cs
      - Assets/AthmarVisionCount/Runtime/SkuCatalogue.cs
      - Assets/AthmarVisionCount/Runtime/YoloOutputDecoder.cs
      - Packages/**
      - ProjectSettings/**

permissions:
  contents: write
  pages: write
  id-token: write

env:
  UNITY_VERSION: 6000.3.10f1
  DEMO_PACKAGE_BASE_URL: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1

concurrency:
  group: demo-customer-package-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate demo package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate demo customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.DemoCustomerPackageBuilder.Build
          customParameters: -demoPackageBaseUrl ${{ env.DEMO_PACKAGE_BASE_URL }}
          runAsHostUser: true

      - name: Validate generated install values
        shell: bash
        run: |
          test -s Build/DemoCustomerPackage/manifest.json
          test -s Build/DemoCustomerPackage/manifest.sha256
          test -s Build/DemoCustomerPackage/install-values.txt
          test -s Build/DemoCustomerPackage/production.sentis
          test -s Build/DemoCustomerPackage/sku_catalogue.csv
          grep -Eq '^[0-9a-fA-F]{64}$' Build/DemoCustomerPackage/manifest.sha256
          echo '## Demo customer package install values' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat Build/DemoCustomerPackage/install-values.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload complete demo package artifact
        uses: actions/upload-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage
          if-no-files-found: error
          retention-days: 30

      - name: Prepare GitHub Pages artifact
        shell: bash
        run: |
          mkdir -p _site/demo-customer-v1
          cp Build/DemoCustomerPackage/manifest.json _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/manifest.sha256 _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/install-values.txt _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/production.sentis _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/sku_catalogue.csv _site/demo-customer-v1/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published manifest
        shell: bash
        run: |
          manifest_url="${DEMO_PACKAGE_BASE_URL}/manifest.json"
          expected_sha_url="${DEMO_PACKAGE_BASE_URL}/manifest.sha256"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --location "$manifest_url" -o /tmp/manifest.json \
              && curl --fail --silent --show-error --location "$expected_sha_url" -o /tmp/manifest.sha256; then
              break
            fi
            sleep 10
          done
          expected_sha="$(tr -d '[:space:]' < /tmp/manifest.sha256)"
          actual_sha="$(sha256sum /tmp/manifest.json | awk '{print $1}')"
          test "$actual_sha" = "$expected_sha"
          echo "Manifest URL: $manifest_url" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest SHA-256: $actual_sha" >> "$GITHUB_STEP_SUMMARY"

  persist-install-values:
    name: Persist published install values
    needs: deploy
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download demo package artifact
        uses: actions/download-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage

      - name: Persist install values in repository
        shell: bash
        run: |
          mkdir -p docs/generated
          cp Build/DemoCustomerPackage/install-values.txt docs/generated/demo-install-values.txt
          cp Build/DemoCustomerPackage/manifest.sha256 docs/generated/demo-manifest.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/demo-install-values.txt docs/generated/demo-manifest.sha256
          if ! git diff --cached --quiet; then
            git commit -m "docs: update demo package install values [skip ci]"
            git push origin HEAD:main
          fi
