name: Publish Demo Customer Package

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: demo-customer-package-pages
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.3.10f1
  DEMO_PACKAGE_BASE_URL: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1

jobs:
  build-and-publish:
    name: Build and publish demo package
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: https://athmar-labs.github.io/athmar-vision-count/demo-customer-v1/manifest.json

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate demo customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.DemoCustomerPackageBuilder.Build
          customParameters: -demoPackageBaseUrl ${{ env.DEMO_PACKAGE_BASE_URL }}
          runAsHostUser: true

      - name: Upload complete demo package
        uses: actions/upload-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage
          if-no-files-found: error
          retention-days: 30

      - name: Prepare Pages artifact
        shell: bash
        run: |
          mkdir -p _site/demo-customer-v1
          cp Build/DemoCustomerPackage/manifest.json _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/production.sentis _site/demo-customer-v1/
          cp Build/DemoCustomerPackage/sku_catalogue.csv _site/demo-customer-v1/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
