name: Build Demo Customer Package

on:
  workflow_dispatch:
    inputs:
      packageBaseUrl:
        description: HTTPS directory where the generated package will be hosted
        required: true
        type: string

permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.10f1

jobs:
  build:
    name: Build and validate demo package
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity
        shell: bash
        run: |
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true
          sudo apt-get clean
          docker system prune --all --force --volumes || true

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Build and validate demo customer package
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneLinux64
          buildMethod: AthmarLabs.VisionCount.Editor.DemoCustomerPackageBuilder.Build
          customParameters: -demoPackageBaseUrl ${{ inputs.packageBaseUrl }}
          runAsHostUser: true

      - name: Upload complete demo package
        uses: actions/upload-artifact@v4
        with:
          name: athmar-demo-customer-package
          path: Build/DemoCustomerPackage
          if-no-files-found: error
          retention-days: 30
