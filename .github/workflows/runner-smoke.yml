name: Runner Smoke

on:
  pull_request:
    paths:
      - ".github/workflows/runner-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify GitHub-hosted runner startup
        run: |
          echo "runner-ok"
          uname -a
