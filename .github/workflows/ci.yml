name: Production CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: vision-count-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.10f1

jobs:
  repository-guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate project structure and sensitive files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import pathlib
          import subprocess

          required = [
              pathlib.Path("Packages/manifest.json"),
              pathlib.Path("ProjectSettings/ProjectVersion.txt"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/Athmar.VisionCount.Runtime.asmdef"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/VisionCountApp.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/VisionInferenceRunner.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/CustomerPackageManifest.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/CustomerPackageStore.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/CustomerPackageInstaller.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/CustomerAdminView.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/AdminPinStore.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/YoloOutputDecoder.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Runtime/SkuCatalogue.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Editor/ProjectBootstrapper.cs"),
              pathlib.Path("Assets/AthmarVisionCount/Editor/ProductionReadinessValidator.cs"),
              pathlib.Path("SECURITY.md"),
              pathlib.Path("PRIVACY.md"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit("Missing required files: " + ", ".join(missing))

          manifest = json.loads(pathlib.Path("Packages/manifest.json").read_text(encoding="utf-8"))
          dependencies = manifest.get("dependencies", {})
          expected = {
              "com.unity.ai.inference": "2.4.1",
              "com.unity.xr.arcore": "6.4.1",
              "com.unity.xr.arfoundation": "6.4.1",
          }
          for package, version in expected.items():
              if dependencies.get(package) != version:
                  raise SystemExit(f"{package} must be pinned to {version}")

          project_version = pathlib.Path("ProjectSettings/ProjectVersion.txt").read_text(encoding="utf-8")
          if "6000.3.10f1" not in project_version:
              raise SystemExit("Unity editor version is not pinned to 6000.3.10f1")

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_suffixes = (".keystore", ".jks", ".p12", ".pem", ".key", ".onnx", ".sentis", ".tflite")
          forbidden_prefixes = (
              "library/", "temp/", "obj/", "build/", "builds/", "customerdata/", "datasets/",
              "assets/privatemodels/", "assets/privateconfig/", "assets/generated/", ".ci/",
          )
          forbidden_paths = []
          for value in tracked:
              lower = value.lower()
              if lower.endswith(forbidden_suffixes) or pathlib.PurePosixPath(lower).name.startswith(".env"):
                  forbidden_paths.append(value)
              if lower.startswith(forbidden_prefixes):
                  forbidden_paths.append(value)
          if forbidden_paths:
              raise SystemExit("Sensitive or generated files are tracked: " + ", ".join(sorted(set(forbidden_paths))))

          print("Repository guardrails passed.")
          PY

  unity-editmode-tests:
    name: Unity EditMode tests
    needs: repository-guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Verify Unity activation secrets
        shell: bash
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE"
          test -n "$UNITY_EMAIL"
          test -n "$UNITY_PASSWORD"

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: test-results
          if-no-files-found: warn
          retention-days: 14

  android-release:
    name: Signed Generic Android App Bundle
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - repository-guardrails
      - unity-editmode-tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim runner disk space for Unity Android image
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk space before cleanup:"
          df -h /

          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/share/chromium \
            /opt/google/chrome \
            /opt/microsoft/msedge || true

          sudo apt-get clean
          docker system prune --all --force --volumes || true

          echo "Disk space after cleanup:"
          df -h /
          available_kb=$(df --output=avail / | tail -n 1 | tr -d ' ')
          minimum_kb=$((20 * 1024 * 1024))
          if [ "$available_kb" -lt "$minimum_kb" ]; then
            echo "At least 20 GiB of free disk space is required before pulling the Unity Android image."
            exit 1
          fi

      - name: Verify Android signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASS"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_ALIAS_PASS"

      - name: Build validated generic Android App Bundle
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: AthmarLabs.VisionCount.Editor.ProductionReadinessValidator.BuildAndroidRelease
          versioning: Custom
          version: ${{ vars.ATHMAR_APP_VERSION }}
          androidVersionCode: ${{ vars.ATHMAR_ANDROID_VERSION_CODE }}
          androidExportType: androidAppBundle
          androidKeystoreName: release.keystore
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEY_ALIAS }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
          runAsHostUser: true

      - name: Upload signed generic release package
        uses: actions/upload-artifact@v4
        with:
          name: athmar-vision-count-android-release
          path: |
            Build/AthmarVisionCount.aab
            Build/AthmarVisionCount.aab.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing and generated material
        if: always()
        shell: bash
        run: sudo rm -rf Assets/Generated release.keystore .ci
